# nginx in front of the church, behind Cloudflare's proxy.

# Every request arrives from Cloudflare, so take the visitor's real address from
# CF-Connecting-IP, trusting it only from Cloudflare's own ranges.
# Current list: https://www.cloudflare.com/ips/ (it changes rarely; re-check now and then).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# A service id in a URL is a handle to that attendee's service, so the access log
# records the path with it blanked out, and no user agent. (The app itself keeps no access log.)
map $request_uri $redacted_uri {
    "~^(?<head>/api/services/)svc_[^/?]*(?<tail>.*)$"  "${head}svc_REDACTED${tail}";
    default                                           $request_uri;
}
log_format redacted '$remote_addr - [$time_local] "$request_method $redacted_uri $server_protocol" '
                    '$status $body_bytes_sent';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name approximategrace.church www.approximategrace.church;
    access_log /var/log/nginx/access.log redacted;
    return 301 https://approximategrace.church$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.approximategrace.church;
    access_log /var/log/nginx/access.log redacted;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    return 301 https://approximategrace.church$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name approximategrace.church;
    access_log /var/log/nginx/access.log redacted;

    # Cloudflare Origin Certificate (SSL/TLS mode: Full (strict)).
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    client_max_body_size 64k;   # the longest liturgical response is a few KB

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # After real_ip, $remote_addr is the visitor, not Cloudflare.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # The chapel's live updates are a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
